name: Deploy to GitHub Pages

# Every push to main publishes. The manual trigger is there for
# re-publishing without a commit — useful after changing the custom
# domain or the VITE_BASE variable, neither of which touches the source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a cancelled deploy
# can leave the site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: it installs exactly what package-lock.json pins,
      # so the deployed build matches the one that was tested locally.
      - run: npm ci

      # tsc -b runs as part of build, so a type error stops the deploy
      # rather than shipping.
      - name: Build
        run: npm run build
        env:
          # '/' is correct for a custom domain (the CNAME below) and for a
          # <user>.github.io repo. For a project site served from
          # https://<user>.github.io/<repo>/, add a repository variable
          # VITE_BASE with the value /<repo>/ — Settings → Secrets and
          # variables → Actions → Variables.
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
