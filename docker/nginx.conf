# marriage.automatebrains.com
#
# Two servers: port 80 exists to answer ACME challenges and to send
# everything else to HTTPS; port 443 serves the site.
#
# If you move this to another domain, change server_name in both blocks
# and the two ssl_certificate paths — they are named after the
# certificate lineage certbot creates, not after the request host.

server {
    listen 80;
    listen [::]:80;
    server_name marriage.automatebrains.com;

    # Must stay on plain HTTP and must not be redirected — this is the
    # path Let's Encrypt fetches to prove the domain is yours, including
    # on every renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marriage.automatebrains.com;

    ssl_certificate     /etc/letsencrypt/live/marriage.automatebrains.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marriage.automatebrains.com/privkey.pem;
    # Written into the volume by scripts/init-letsencrypt.sh.
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # The site is one HTML file plus hashed assets. A deep link that does
    # not exist should still get the page rather than nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a stale copy can never be
    # wrong — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The entry point is not fingerprinted. Caching it is how a deploy
    # goes out and nobody sees it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Photographs dropped into public/ — long-lived but revalidated, since
    # these filenames are stable and may be replaced in place.
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # three.js is ~880kB uncompressed. Without this the hero would ship it
    # in full to every guest on hotel wifi.
    gzip_comp_level 6;
}
